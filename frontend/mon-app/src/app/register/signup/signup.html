<form class="grid grid-cols-1 gap-y-5">

  <div class="grid grid-cols-1 gap-y-2">
    <label
      for="name"
      class="text-sm font-medium text-gray-700"
    >
      Name
    </label>

    <input
      id="name"
      type="text"
      placeholder="John Doe"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg
             outline-none focus:ring-2 focus:ring-black"
    />
  </div>

  <div class="grid grid-cols-1 gap-y-2">
    <label
      for="signup-email"
      class="text-sm font-medium text-gray-700"
    >
      Email
    </label>

    <input
      id="signup-email"
      type="email"
      placeholder="you@example.com"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg
             outline-none focus:ring-2 focus:ring-black"
    />
  </div>

  <div class="grid grid-cols-1 gap-y-2">
    <label
      for="signup-password"
      class="text-sm font-medium text-gray-700"
    >
      Password
    </label>

    <input
      id="signup-password"
      type="password"
      placeholder="••••••••"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg
             outline-none focus:ring-2 focus:ring-black"
    />
  </div>

  <button
    type="button"
    class="w-full bg-black text-white py-3 rounded-lg
           font-medium cursor-pointer hover:bg-gray-800
           transition"
  >
    Create Account
  </button>

</form>
