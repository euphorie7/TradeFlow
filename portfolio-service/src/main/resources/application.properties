# ========================
# Application
# ========================
spring.application.name=portfolio
server.port= 3100

# ========================
# PostgreSQL
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolioServiceDb
spring.datasource.username=testeur
spring.datasource.password=testeur

# ========================
# spring boot actuator
# ========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.server.port=3101


# ========================
# Swagger
# ========================
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# ========================
# migration
# ========================
spring.jpa.hibernate.ddl-auto=update


# ========================
# JwtService
# ========================
jwt.secret=je-suis-sence-ecrire-une-bonne-cle-secrete-dau-moin-32-caracteres 



# ========================
# spring security logs
# ========================
logging.level.org.springframework.security=TRACE

# ========================
# Kafka
# ========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=portfolio-service

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.euphorie.kafka.event.OrderExecutedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.euphorie.kafka.event